<script>
	function readData() {
		
		let monthSelectionObj = document.getElementById("monthSelection");
		Object.keys(data).forEach(function(month) {
			let newOption = document.createElement('option');
			newOption.value = month;
			newOption.innerHTML = month;
			monthSelectionObj.appendChild(newOption);
		});
		monthChanged();
	};
	
	function monthChanged() {
		let monthSelectionObj = document.getElementById("monthSelection");
		let daySelectionObj = document.getElementById("daySelection");
		daySelectionObj.innerHTML = "";
		let month = monthSelectionObj.options[monthSelectionObj.selectedIndex].value;
		Object.keys(data[month]).forEach(function(day) {
			if (data[month][day].length !== 1) {
				alert(month + "/" + day + " has more or less than one element!!!");
			} else {
				let entry = data[month][day][0];
				let newOption = document.createElement('option');
				newOption.value = day;
				newOption.innerHTML = day;
				daySelectionObj.appendChild(newOption);
			}
		});
		dayChanged();
	}
	function dayChanged() {
		let monthSelectionObj = document.getElementById("monthSelection");
		let daySelectionObj = document.getElementById("daySelection");
		document.getElementById("question").value = "--No data--";
		let month = monthSelectionObj.options[monthSelectionObj.selectedIndex].value;
		let day = daySelectionObj.options[daySelectionObj.selectedIndex].value;
		let entry = data[month][day][0];
		document.getElementById("question").value = entry.question;
		document.getElementById("answer").value = entry.answer;
	}
	
	function toggleAnswer() {
		document.getElementById("answer").hidden = !document.getElementById("answer").hidden;
	}



	readData();






</script>
